<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer Dark Ring & Mint Green Ring -->
  <circle cx="200" cy="200" r="192" fill="#111111"/>
  <circle cx="200" cy="200" r="184" fill="#66c4a8"/>
  <circle cx="200" cy="200" r="152" fill="#111111"/>
  <circle cx="200" cy="200" r="148" fill="#ffffff"/>

  <!-- Arch / Bridge Motif above "tulu" -->
  <path d="M 100 180 C 100 148 135 148 175 148 C 215 148 215 180 195 180 C 185 162 165 162 145 162 C 125 162 112 180 100 180 Z" fill="#66c4a8"/>

  <!-- "tulu motors" Text -->
  <g transform="translate(200, 225)">
    <!-- "tulu" in bold rounded lowercase -->
    <text x="-95" y="0" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-size="52" font-weight="800" fill="#111827" letter-spacing="-1">
      tulu
    </text>
    <!-- "motors" in light teal lowercase with wider tracking -->
    <text x="18" y="-2" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-size="34" font-weight="400" fill="#66c4a8" letter-spacing="4">
